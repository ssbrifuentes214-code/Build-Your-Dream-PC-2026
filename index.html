<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Build Your Dream PC · Expo Técnica 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Figtree:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
/* styles.css — colores, tipografías y diseño de la página */

/* ---------- Colores y base ---------- */
:root {
  --navy:#060f26;
  --deep:#0b1f4d;
  --blue:#2456d6;
  --sky:#c9d2e6;
  --ice:#0f2b6e;
  --cyan:#5a8bff;
  --ink:#eef1f8;
  --line:#2a559e;
  --a:#5a8bff;
  --b:#ffd23f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

html {
  scroll-padding-top:70px;
  scroll-behavior:smooth;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--navy);
  color:var(--ink);
  font:400 17px/1.6 Figtree,system-ui,sans-serif;
}

h1,
h2,
h3 {
  font-family:'Chakra Petch',sans-serif;
  line-height:1.1;
  margin:0;
}

.fps {
  font-family:'Space Mono',monospace;
}

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline:3px solid var(--cyan);
  outline-offset:2px;
}


/* ---------- Encabezado, menú e idioma ---------- */
header {
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:9;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  background:rgba(6,15,38,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid #1d3f7a;
}

header b {
  font-family:'Chakra Petch';
  font-size:18px;
  color:#fff;
}

nav {
  display:flex;
  gap:4px;
  overflow-x:auto;
}

nav a {
  color:var(--sky);
  text-decoration:none;
  padding:6px 10px;
  border-radius:6px;
  font-weight:500;
  font-size:15px;
  white-space:nowrap;
}

nav a:hover,
nav a:focus-visible {
  background:var(--deep);
  color:#fff;
}

.lang {
  display:flex;
  border:1.5px solid var(--blue);
  border-radius:8px;
  overflow:hidden;
}

.lang button {
  background:none;
  border:0;
  color:var(--sky);
  padding:6px 12px;
  font:700 14px 'Chakra Petch';
  cursor:pointer;
}

.lang button[aria-pressed=true] {
  background:var(--blue);
  color:#fff;
}


/* ---------- Secciones y títulos ---------- */
section {
  max-width:1040px;
  margin:0 auto;
  padding:64px 20px;
}

section.top {
  padding-top:48px;
  padding-bottom:8px;
}

.top h1 {
  font-size:clamp(40px,8vw,84px);
  color:#fff;
  letter-spacing:-1px;
}

.top h1 span {
  color:var(--cyan);
}

.slogan {
  font-size:22px;
  color:var(--sky);
  margin:12px 0 0;
}

h2 {
  font-size:clamp(28px,5vw,42px);
  color:#fff;
  margin-bottom:10px;
}

.lead {
  max-width:62ch;
  color:var(--sky);
}


/* ---------- Franjas azules ---------- */
.band {
  background:var(--ice);
  color:#fff;
}


/* ---------- 1. Simulador: piezas, PC en vivo y ficha ---------- */
.lab {
  display:grid;
  grid-template-columns:minmax(0,1fr) 390px;
  grid-template-areas:"pick side" "rig side";
  gap:24px 28px;
  margin-top:28px;
  align-items:start;
}

#opts,
.rig {
  min-width:0;
}

#opts {
  grid-area:pick;
}

.pg {
  margin-bottom:22px;
}

.pg h3 {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:19px;
  margin-bottom:10px;
  color:#fff;
}

.pg-n {
  display:grid;
  place-items:center;
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--b);
  color:#060f26;
  font:700 15px 'Chakra Petch';
}

.pcs {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:10px;
}

.pc {
  position:relative;
  display:flex;
  flex-direction:column;
  gap:6px;
  text-align:left;
  background:var(--navy);
  color:#fff;
  border:2px solid #1d3f7a;
  border-top:5px solid var(--c);
  border-radius:12px;
  padding:10px 12px 12px;
  font:inherit;
  cursor:pointer;
  transition:transform .15s,box-shadow .15s,background .15s;
}

.pc:hover {
  transform:translateY(-3px);
}

.pc.on {
  border-color:var(--c);
  background:#0b1f4d;
  box-shadow:0 0 0 2px var(--c),0 10px 24px -8px var(--c);
}

.pc.on::after {
  content:'✓';
  position:absolute;
  top:8px;
  right:8px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--b);
  color:#060f26;
  font:700 12px/20px sans-serif;
  text-align:center;
}

.pc-n {
  padding-right:18px;
  font:700 16px/1.15 'Chakra Petch',sans-serif;
}

.pc-s {
  font-size:13px;
  color:var(--sky);
}

.pc-bar {
  height:6px;
  border-radius:3px;
  background:#1d3f7a;
  overflow:hidden;
}

.pc-bar i {
  display:block;
  height:100%;
  border-radius:3px;
  background:var(--c);
}

.pc-p {
  font:700 14px 'Space Mono',monospace;
  white-space:nowrap;
  color:var(--b);
}


/* ---- PC en vivo: gabinete y medidor ---- */
.rig {
  grid-area:rig;
  background:var(--navy);
  border:2px solid var(--line);
  border-radius:16px;
  padding:16px 18px 18px;
}

.rig h3 {
  font-size:19px;
  color:#fff;
  margin-bottom:10px;
}

.rig-in {
  display:grid;
  grid-template-columns:230px minmax(0,1fr);
  gap:20px;
  align-items:center;
}

#tower {
  display:block;
  width:100%;
  height:auto;
}

.sm-glow {
  opacity:0;
}

#tower.on .sm-glow {
  opacity:1;
  animation:rgb 4s linear infinite;
}

.sm-pop {
  animation:drop .6s ease-out both;
}

.t-lbl {
  fill:#cdd8f5;
  font:600 8px Figtree,sans-serif;
  text-anchor:middle;
}

.t-guide {
  fill:#5f7fc9;
  font:700 9px 'Chakra Petch',sans-serif;
  text-anchor:middle;
}

.t-psu {
  fill:#cfd3dc;
  font:700 11px 'Chakra Petch',sans-serif;
}

.t-sub {
  fill:#9aa2b3;
  font-size:7px;
}

.t-aio {
  fill:#cfd3dc;
  font:700 7px sans-serif;
  text-anchor:middle;
}

.gauge svg {
  display:block;
  width:100%;
  max-width:280px;
  margin:0 auto;
}

.g-track {
  fill:none;
  stroke:#1d3f7a;
  stroke-width:14;
  stroke-linecap:round;
}

.g-val {
  fill:none;
  stroke:url(#gg);
  stroke-width:14;
  stroke-linecap:round;
  stroke-dasharray:0 100;
  transition:stroke-dasharray .6s ease,opacity .3s;
}

.g-num {
  fill:#fff;
  font-size:34px;
  font-weight:700;
  text-anchor:middle;
}

.g-unit {
  fill:var(--sky);
  font:700 12px 'Chakra Petch',sans-serif;
  text-anchor:middle;
}

.g-tick {
  fill:var(--sky);
  font-size:11px;
}

.lvl {
  display:table;
  margin:2px auto 0;
  padding:3px 16px;
  border-radius:99px;
  background:var(--deep);
  border:1px solid var(--line);
  color:var(--b);
  font:700 16px 'Chakra Petch',sans-serif;
}

.msg {
  margin-top:10px;
  padding:10px 12px;
  border-radius:10px;
  background:var(--deep);
  font-size:15px;
}

.msg.warn {
  background:#3a2a00;
  color:#ffd98a;
}


/* ---- Columna derecha: moneda, ficha y botones ---- */
.lab-side {
  grid-area:side;
  position:sticky;
  top:76px;
  display:grid;
  gap:14px;
  min-width:0;
}

/* ---------- Moneda: dólar / peso y cotización ---------- */
.cur {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
}

.seg {
  display:flex;
  border:1.5px solid var(--blue);
  border-radius:8px;
  overflow:hidden;
}

.seg button {
  background:none;
  border:0;
  color:var(--sky);
  padding:6px 12px;
  font:700 14px 'Chakra Petch';
  cursor:pointer;
}

.seg button[aria-pressed=true] {
  background:var(--blue);
  color:#fff;
}

.rate {
  display:flex;
  align-items:center;
  gap:6px;
  font-size:14px;
  color:var(--sky);
}

.rate[hidden] {
  display:none;
}

.rate input {
  width:92px;
  padding:6px 8px;
  border-radius:8px;
  border:1.5px solid var(--blue);
  background:var(--navy);
  color:#fff;
  font:700 14px 'Space Mono',monospace;
}


/* ---------- Hoja para imprimir y QR (la ficha en papel) ---------- */
.paper {
  --p:#f3f6ff;
  position:relative;
  margin-bottom:8px;
  padding:18px 18px 22px;
  background:var(--p);
  color:#0b1f4d;
  border-radius:12px 12px 0 0;
  font-size:15px;
  box-shadow:0 14px 30px -12px #000c;
}

.pp-top {
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding-bottom:8px;
  border-bottom:2px dashed #9fb0d8;
  font:700 13px 'Chakra Petch',sans-serif;
  color:#2456d6;
}

.pp-top span {
  color:#5a6a94;
  font-weight:500;
}

.pp-title {
  margin:12px 0 10px;
  font:700 25px/1 'Chakra Petch',sans-serif;
  color:#0b1f4d;
}

.pp-rows {
  border-top:1px solid #cfd8ee;
}

.pp-r {
  display:flex;
  gap:10px;
  align-items:baseline;
  padding:6px 0;
  border-bottom:1px solid #cfd8ee;
}

.pp-l {
  flex:none;
  width:112px;
  font:700 13px 'Chakra Petch',sans-serif;
  color:#5a6a94;
}

.pp-n {
  flex:1;
  font-weight:500;
}

.pp-r b {
  font:700 15px 'Space Mono',monospace;
}

.pp-fps {
  margin:12px 0;
  padding:10px;
  background:#0b1f4d;
  color:#ffd23f;
  border-radius:8px;
  text-align:center;
  font-size:22px;
}

.pp-total {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-top:12px;
  padding-top:10px;
  border-top:2px solid #0b1f4d;
  font:700 18px 'Chakra Petch',sans-serif;
}

.pp-total b {
  font-size:26px;
  color:#2456d6;
}

.pp-note {
  margin:4px 0 0;
  font-size:12px;
  color:#5a6a94;
}

.pp-hint {
  margin:14px 0 4px;
  font-size:14px;
  color:#5a6a94;
  text-align:center;
}

.pp-qr {
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:14px;
  padding-top:12px;
  border-top:2px dashed #9fb0d8;
}

.pp-qr svg {
  flex:none;
  width:160px;
  height:160px;
  border:1px solid #cfd8ee;
}

.pp-qr span {
  font-size:14px;
  color:#34456f;
}

.pp-date {
  margin-top:10px;
  font-size:12px;
  color:#5a6a94;
  text-align:right;
}

.zig {
  position:absolute;
  left:0;
  bottom:-7px;
  display:block;
  width:100%;
  height:8px;
}

.zig path {
  fill:var(--p);
}

.acts {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.acts .btn {
  flex:1;
  margin:0;
}

.btn:disabled {
  opacity:.4;
  cursor:not-allowed;
}

#qrdlg {
  max-width:92vw;
  padding:0;
  border:0;
  border-radius:18px;
  background:#f3f6ff;
  color:#0b1f4d;
  text-align:center;
}

#qrdlg::backdrop {
  background:rgba(3,8,24,.82);
  backdrop-filter:blur(4px);
}

.qd {
  padding:22px;
}

.qd h3 {
  color:#0b1f4d;
  font-size:24px;
}

.qd p {
  max-width:30ch;
  margin:6px auto 0;
  color:#34456f;
}

#qrdlg {
  width:min(92vw,420px);
}

.qd .qlink {
  max-width:none;
  margin:8px 0 0;
  font-size:12px;
  color:#34456f;
  word-break:break-all;
}

.qlink a {
  color:#2456d6;
}

.qsite {
  margin:12px 0 4px;
  text-align:left;
}

.qsite label {
  display:block;
  margin-bottom:4px;
  font:700 13px 'Chakra Petch',sans-serif;
  color:#0b1f4d;
}

.qsite input {
  width:100%;
  padding:9px 10px;
  border-radius:8px;
  border:1.5px solid #9fb0d8;
  background:#fff;
  color:#0b1f4d;
  font:inherit;
}

.qd .qnote {
  max-width:none;
  margin:6px 0 0;
  font-size:13px;
  color:#34456f;
}

.qnote[hidden],
.qlink[hidden],
.qsite[hidden] {
  display:none;
}

#qrbig {
  width:min(76vw,300px);
  margin:14px auto;
}

#qrbig svg {
  display:block;
  width:100%;
  height:auto;
  border:1px solid #cfd8ee;
}

#printRoot {
  display:none;
}


.row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
}


/* ---------- Paneles, botones y barra ---------- */
.panel {
  background:var(--deep);
  border:2px solid var(--line);
  border-radius:12px;
  padding:16px;
  margin-top:20px;
}

.btn {
  background:var(--a);
  color:#060f26;
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font:700 15px 'Chakra Petch',sans-serif;
  cursor:pointer;
  margin:8px 6px 0 0;
}

.btn.alt {
  background:transparent;
  color:var(--ink);
  border:2px solid var(--line);
}

.btn.sel {
  background:var(--b);
  color:#060f26;
}

.bar {
  height:16px;
  background:var(--navy);
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--line);
  margin:8px 0;
}

.bar i {
  display:block;
  height:100%;
  width:0;
  background:var(--a);
}


/* ---------- 2. Armado (animación) ---------- */
#v2svg {
  width:100%;
  height:auto;
  border-radius:10px;
}

.video h3 {
  color:var(--a);
}

.video p {
  margin:4px 0;
}

.me {
  font-weight: 700;
  color: #fff;
  margin: 0 0 10px;
}

.inst {
  font-weight: 700;
  color: #fff;
  background: var(--navy);
  border-left: 4px solid var(--a);
  padding: 8px 12px;
  border-radius: 6px;
}

.tip {
  color:var(--b);
}

.parts {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  font-size:13px;
  margin:8px 0;
}

.drop {
  animation:drop .8s ease-out both;
}

.d1 {
  animation-delay:.6s;
}

.d2 {
  animation-delay:1.2s;
}

.fan {
  transform-box:fill-box;
  transform-origin:center;
}

.on .fan {
  animation:spin .5s linear infinite;
}

.rgb {
  opacity:.3;
}

.on .rgb {
  opacity:1;
  animation:rgb 4s linear infinite;
}

.glow {
  opacity:0;
}

.on .glow {
  opacity:1;
}

@keyframes drop {
  from {
    opacity:0;
    transform:translateY(-40px);
  }

  to {
    opacity:1;
    transform:none;
  }

}

@keyframes spin {
  to {
    transform:rotate(360deg);
  }

}

@keyframes rgb {
  to {
    filter:hue-rotate(360deg);
  }

}


/* ---------- 3. Juego ---------- */
.okc {
  color:var(--cyan);
}

.qc {
  font-size:18px;
  margin:12px 0 0;
}

.qq {
  font-weight:700;
  margin:4px 0;
}

.qm {
  min-height:48px;
  margin-top:10px;
}


/* ---------- 4. Glosario: cartas con dibujo, concepto y voz ---------- */
.search {
  width:100%;
  max-width:380px;
  padding:11px 14px;
  border-radius:10px;
  border:1.5px solid var(--blue);
  background:var(--navy);
  color:#fff;
  font:inherit;
  margin:16px 0;
}

.gmsg {
  min-height:24px;
  margin:0 0 10px;
  color:var(--b);
  font-size:15px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:14px;
  align-items:start;
}

.gcell {
  display:flex;
  flex-direction:column;
  gap:6px;
}

.flip {
  position:relative;
  height:218px;
  perspective:700px;
  background:none;
  border:0;
  padding:0;
  cursor:pointer;
  font:inherit;
  color:#fff;
}

.face {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:12px;
  border-radius:14px;
  text-align:center;
  backface-visibility:hidden;
  transition:transform .5s;
}

.face b {
  font:700 16px/1.15 'Chakra Petch',sans-serif;
}

.face small {
  font-size:13px;
  line-height:1.35;
  color:var(--sky);
}

.face.f {
  background:var(--blue);
  border:1px solid #3a63c9;
}

.face.b {
  background:#1a3a8f;
  border:1px solid #3a63c9;
  transform:rotateY(180deg);
}

.flip.on .f {
  transform:rotateY(-180deg);
}

.flip.on .b {
  transform:rotateY(0);
}

.gi {
  width:64px;
  height:64px;
  flex:none;
  color:#fff;
  fill:none;
  stroke:currentColor;
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.gi .ac {
  stroke:var(--b);
}

.gaudio {
  display:flex;
  gap:6px;
}

.gaudio[hidden] {
  display:none;
}

.gaudio button {
  flex:1;
  padding:8px 4px;
  white-space:nowrap;
  background:transparent;
  color:#fff;
  border:1.5px solid var(--cyan);
  border-radius:8px;
  font:700 13px 'Chakra Petch',sans-serif;
  cursor:pointer;
}

.gaudio button:hover {
  background:var(--blue);
}


.cf-end {
  max-width:1040px;
  margin:0 auto;
  padding:48px 20px 8px;
  text-align:center;
}

.cf-end .btn {
  display:inline-block;
  margin:0;
  padding:14px 24px;
  font-size:17px;
  text-decoration:none;
}

.site {
  margin-top:14px;
  display:grid;
  gap:6px;
  text-align:left;
}

.site[hidden] {
  display:none;
}

.site input {
  width:100%;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #2a559e;
  background:#0b1f4d;
  color:#fff;
  font:inherit;
}

.site small {
  opacity:.8;
}

/* ---------- Pie de página ---------- */
footer {
  padding:36px 20px;
  text-align:center;
  color:var(--sky);
  border-top:1px solid #1d3f7a;
}


/* ---------- Celulares y accesibilidad ---------- */
@media (max-width:820px) {
  .lab {
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:"pick" "rig" "side";
  }

  .lab-side {
    position:static;
  }

  nav {
    display:none;
  }

}

@media (max-width:560px) {
  .rig-in {
    grid-template-columns:minmax(0,1fr);
  }

  #tower {
    max-width:210px;
    margin:0 auto;
  }

  .pcs {
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x proximity;
    padding-bottom:8px;
  }

  .pc {
    flex:0 0 142px;
    scroll-snap-align:start;
  }

  .pp-qr {
    flex-direction:column;
    text-align:center;
  }

}

@media (prefers-reduced-motion:reduce) {
  * {
    transition:none!important;
    scroll-behavior:auto!important;
  }

/* =========================================================
   qr.js — generador de códigos QR (propio, sin librerías)
   Modo byte, corrección de errores nivel M, versiones 1 a 40.
   Uso: const q = QR.make('texto');  q.n = lado en módulos
        q.dark(fila, columna) → true si el módulo es negro
   ========================================================= */

const QR = (() => {
  // Tablas del estándar para el nivel M (posición = versión)
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
  const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];

  // Módulos que quedan para datos + corrección en cada versión
  const rawModules = v => {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) {
      const a = Math.floor(v / 7) + 2;
      r -= (25 * a - 10) * a - 55;
      if (v >= 7) r -= 36;
    }
    return r;
  };
  const dataWords = v => Math.floor(rawModules(v) / 8) - ECC[v] * BLK[v];

  // ---- Corrección de errores (Reed-Solomon en GF(256)) ----
  const mul = (x, y) => {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  };
  const rsGen = degree => {
    const r = new Array(degree).fill(0);
    r[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < r.length; j++) {
        r[j] = mul(r[j], root);
        if (j + 1 < r.length) r[j] ^= r[j + 1];
      }
      root = mul(root, 2);
    }
    return r;
  };
  const rsRem = (data, gen) => {
    const res = new Array(gen.length).fill(0);
    for (const b of data) {
      const f = b ^ res.shift();
      res.push(0);
      gen.forEach((c, i) => { res[i] ^= mul(c, f); });
    }
    return res;
  };

  // Posiciones de los cuadritos de alineación
  const alignPos = v => {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, size = v * 4 + 17;
    const step = Math.floor((v * 8 + n * 3 + 5) / (n * 4 - 4)) * 2;
    const r = [6];
    for (let p = size - 7; r.length < n; p -= step) r.splice(1, 0, p);
    return r;
  };

  const masks = [
    (x, y) => (x + y) % 2 === 0,
    (x, y) => y % 2 === 0,
    (x, y) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
    (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
    (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0,
    (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0,
  ];

  function make(text) {
    const bytes = Array.from(new TextEncoder().encode(text));

    // 1) Elegir la versión más chica donde entren los datos
    let ver = 1;
    for (; ; ver++) {
      if (ver > 40) throw new Error('Texto demasiado largo para un QR');
      if (4 + (ver < 10 ? 8 : 16) + bytes.length * 8 <= dataWords(ver) * 8) break;
    }

    // 2) Armar los bits: modo byte + largo + datos + relleno
    const bits = [];
    const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4);
    put(bytes.length, ver < 10 ? 8 : 16);
    bytes.forEach(b => put(b, 8));
    const cap = dataWords(ver) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) put(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));

    // 3) Dividir en bloques, calcular corrección y entrelazar
    const nb = BLK[ver], ecl = ECC[ver], raw = Math.floor(rawModules(ver) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), gen = rsGen(ecl);
    const blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const d = data.slice(k, k + shortLen - ecl + (i < nShort ? 0 : 1));
      k += d.length;
      const e = rsRem(d, gen);
      if (i < nShort) d.push(0);
      blocks.push(d.concat(e));
    }
    const out = [];
    for (let i = 0; i < blocks[0].length; i++) {
      blocks.forEach((b, j) => { if (i !== shortLen - ecl || j >= nShort) out.push(b[i]); });
    }

    // 4) Dibujar la matriz
    const size = ver * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const set = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };
    const bit = (n, i) => ((n >>> i) & 1) !== 0;

    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }

    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);

    const ap = alignPos(ver);
    ap.forEach((cy, i) => ap.forEach((cx, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        set(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }));

    const formatBits = m => {            // nivel M = 0
      const d = m;
      let r = d;
      for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412;
      for (let i = 0; i <= 5; i++) set(8, i, bit(b, i));
      set(8, 7, bit(b, 6)); set(8, 8, bit(b, 7)); set(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(b, i));
      set(8, size - 8, true);
    };
    formatBits(0);

    if (ver >= 7) {
      let r = ver;
      for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++) {
        const a = size - 11 + i % 3, c = Math.floor(i / 3);
        set(a, c, bit(b, i)); set(c, a, bit(b, i));
      }
    }

    // 5) Colocar los datos en zigzag
    let k = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
          if (!fn[y][x] && k < out.length * 8) {
            mod[y][x] = bit(out[k >>> 3], 7 - (k & 7));
            k++;
          }
        }
      }
    }

    // 6) Probar las 8 máscaras y quedarse con la mejor
    const applyMask = m => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        if (!fn[y][x] && masks[m](x, y)) mod[y][x] = !mod[y][x];
      }
    };
    const penalty = () => {
      let p = 0, dark = 0;
      const lines = [];
      for (let y = 0; y < size; y++) lines.push(mod[y].map(v => (v ? 1 : 0)).join(''));
      for (let x = 0; x < size; x++) lines.push(mod.map(row => (row[x] ? 1 : 0)).join(''));
      lines.forEach(s => {
        (s.match(/0{5,}|1{5,}/g) || []).forEach(r => { p += 3 + r.length - 5; });
        p += 40 * ((s.match(/(?=10111010000)/g) || []).length + (s.match(/(?=00001011101)/g) || []).length);
      });
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        if (mod[y][x]) dark++;
        if (x < size - 1 && y < size - 1 && mod[y][x] === mod[y][x + 1] && mod[y][x] === mod[y + 1][x] && mod[y][x] === mod[y + 1][x + 1]) p += 3;
      }
      return p + 10 * Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5);
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m); formatBits(m);
      const p = penalty();
      if (p < bestP) { bestP = p; best = m; }
      applyMask(m);
    }
    applyMask(best); formatBits(best);

    return { n: size, version: ver, mask: best, dark: (r, c) => mod[r][c] };
  }

  return { make };
})();

/* =========================================================
   voz.js — leer en voz alta en inglés y en español
   La voz la pone el navegador del dispositivo (no usa internet).
   Lo usan el glosario (app.js) y la ficha del QR (ficha.js).
   ========================================================= */

const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let voices = [];
if (canSpeak) {
  const load = () => { voices = speechSynthesis.getVoices(); };
  load();
  speechSynthesis.onvoiceschanged = load;   // algunos navegadores cargan las voces más tarde
}

// Busca una voz según el idioma (prefs = prefijos en orden de preferencia)
function pickVoice(prefs) {
  for (const p of prefs) {
    const v = voices.find(v => v.lang.replace('_', '-').toLowerCase().startsWith(p));
    if (v) return v;
  }
  return null;
}

// Lee un texto; devuelve false si el dispositivo no tiene voz de ese idioma
function speakOne(text, lang) {
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(lang === 'en' ? ['en-us', 'en'] : ['es-ar', 'es-us', 'es-mx', 'es']);
  u.lang = v ? v.lang : (lang === 'en' ? 'en-US' : 'es-AR');
  if (v) u.voice = v;
  u.rate = 0.92;
  speechSynthesis.speak(u);
  return !!v || !voices.length;
}

/* =========================================================
   game.js — juego "Bottleneck Hunter" (8 rondas)
   ========================================================= */

const ROUNDS = 8;
let gm = { r: 0, score: 0, streak: 0, step: 'fps', msg: '', done: false, cfg: null };

const rnd = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

// Empieza una partida nueva
function gmStart() {
  gm = { r: 0, score: 0, streak: 0, step: 'fps', msg: '', done: false, cfg: null };
  gmNext();
}

// Pasa a la ronda siguiente (o termina)
function gmNext() {
  if (gm.r >= ROUNDS) { gm.done = true; gmDraw(); return; }
  gm.r++;
  const c = rnd(CPU), g = rnd(GPU), r = rnd(RAM);
  const fps = fpsOf(c, g, r);
  gm.cfg = {
    c, g, r, fps,
    bn: c.cap < g.fps,                                       // ¿hay cuello de botella?
    opts: shuffle([fps, Math.round(fps * .6), Math.round(fps * .8), Math.round(fps * 1.25)])
  };
  gm.step = 'fps';
  gm.msg = '';
  gmDraw();
}

// Suma puntos y racha
function award(ok) {
  if (ok) { gm.streak++; gm.score += 10 + (gm.streak - 1) * 5; }
  else gm.streak = 0;
}

// Procesa una respuesta
function gmAnswer(a) {
  const k = gm.cfg;
  if (gm.step === 'fps') {
    const ok = +a === k.fps;
    award(ok);
    gm.msg = ok ? tr('✔ ¡FPS correctos!', '✔ Right FPS!') : tr(`✖ Eran ${k.fps} FPS.`, `✖ It was ${k.fps} FPS.`);
    gm.step = 'bn';
  } else if (gm.step === 'bn') {
    const ok = (a === 'y') === k.bn;
    award(ok);
    gm.msg += ' ' + (ok ? '✔ ' : '✖ ') + (k.bn
      ? tr(`Sí hay cuello de botella: el ${k.c.n} (máx. ${k.c.cap} FPS) frena a la ${k.g.n} (${k.g.fps} FPS).`,
           `Yes, bottleneck: the ${k.c.n} (max ${k.c.cap} FPS) holds back the ${k.g.n} (${k.g.fps} FPS).`)
      : tr('No hay cuello de botella: el CPU puede con la placa de video.',
           'No bottleneck: the CPU can keep up with the graphics card.'));
    gm.step = 'next';
  } else {
    gmNext();
    return;
  }
  gmDraw();
}

// Dibuja el juego
function gmDraw() {
  $('sl').textContent = tr('Puntos:', 'Score:');
  $('stl').textContent = tr('Racha:', 'Streak:');
  $('sc').textContent = gm.score;
  $('st').textContent = gm.streak;

  if (gm.done) {
    $('qr').textContent = tr('¡Fin del juego!', 'Game over!');
    $('qc').textContent = '';
    $('qq').textContent = tr(`Sacaste ${gm.score} puntos.`, `You scored ${gm.score} points.`);
    $('qa').innerHTML = `<button class="btn" data-a="again">${tr('↻ Jugar de nuevo', '↻ Play again')}</button>`;
    $('qm').textContent = '';
    return;
  }

  const k = gm.cfg;
  $('qr').textContent = tr(`Ronda ${gm.r}/${ROUNDS}`, `Round ${gm.r}/${ROUNDS}`);
  $('qc').textContent = `🖥️ ${k.c.n} + ${k.g.n} + ${k.r.n}`;

  if (gm.step === 'fps') {
    $('qq').textContent = tr('¿Cuántos FPS da esta PC?', 'How many FPS does this PC get?');
    $('qa').innerHTML = k.opts.map(o => `<button class="btn alt" data-a="${o}">${o} FPS</button>`).join('');
  } else if (gm.step === 'bn') {
    $('qq').textContent = tr('¿Tiene cuello de botella?', 'Does it have a bottleneck?');
    $('qa').innerHTML = `<button class="btn alt" data-a="y">${tr('Sí', 'Yes')}</button><button class="btn alt" data-a="n">No</button>`;
  } else {
    $('qq').textContent = '';
    $('qa').innerHTML = `<button class="btn" data-a="next">${gm.r >= ROUNDS ? tr('Ver resultado', 'See result') : tr('Siguiente →', 'Next →')}</button>`;
  }
  $('qm').textContent = gm.msg;
}

// Clics sobre las respuestas
$('qa').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.a === 'again') gmStart();
  else gmAnswer(b.dataset.a);
};

</script>
  <script>
/* =========================================================
   app.js — simulador, ficha (imprimir / QR), glosario e idioma
   (textos y datos: data.js · dibujos: icons.js · QR: qr.js ·
    piezas y PC dibujada: parts.js · voz: voz.js · video: video.js · juego: game.js)
   ========================================================= */

let lastPick = null;                 // última pieza tocada (para animarla al aparecer)

/* ---------- 1. Piezas: tarjetas de CPU / GPU / RAM ---------- */
function pcCard(k, i, a) {
  const [txt, pct] = pcInfo(k, a);
  return `
    <button class="pc" data-k="${k}" data-i="${i}" aria-pressed="false" style="--c:${a.c || '#5a8bff'}">
      <span class="pc-n">${a.n}</span>
      <span class="pc-s">${txt}</span>
      <span class="pc-bar"><i style="width:${pct}%"></i></span>
      <span class="pc-p">${money(a.p)}</span>
    </button>`;
}

function pcGroup(k, arr, label, n) {
  return `
    <div class="pg">
      <h3><span class="pg-n">${n}</span>${label}</h3>
      <div class="pcs">${arr.map((a, i) => pcCard(k, i, a)).join('')}</div>
    </div>`;
}

function buildPick() {
  const s = t();
  $('opts').innerHTML = pcGroup('c', CPU, s.gc, 1) + pcGroup('g', GPU, s.gg, 2) + pcGroup('r', RAM, s.gr, 3);
}

/* ---------- 1. PC en vivo: gabinete dibujado + medidor de FPS ---------- */
function buildRig() {
  const s = t();
  $('rig').innerHTML = `
    <h3>${s.rigT}</h3>
    <div class="rig-in">
      <svg id="tower" viewBox="0 0 240 282" role="img" aria-label="${s.rigT}">${TOWER_BASE}<g id="tp"></g></svg>
      <div class="gauge">
        <svg viewBox="0 0 220 130" aria-hidden="true">
          <defs><linearGradient id="gg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#5a8bff"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs>
          <path d="M20 112A90 90 0 0 1 200 112" pathLength="100" class="g-track"/>
          <path id="gv" d="M20 112A90 90 0 0 1 200 112" pathLength="100" class="g-val"/>
          <text id="gn" x="110" y="92" class="g-num fps">—</text>
          <text x="110" y="112" class="g-unit">FPS</text>
          <text x="14" y="127" class="g-tick">0</text>
          <text x="206" y="127" class="g-tick" text-anchor="end">${MAXGPU}</text>
        </svg>
        <div class="lvl" id="fr">—</div>
        <div class="msg" id="fm"></div>
      </div>
    </div>`;
}

/* ---------- 1. Ficha técnica: pantalla, impresión y QR ---------- */
// Datos de lo que se eligió hasta ahora
function fichaData() {
  const c = CPU[sel.c], g = GPU[sel.g], r = RAM[sel.r];
  const parts = [c, g, r];
  const full = parts.every(Boolean);
  const d = { c, g, r, parts, full, total: parts.reduce((n, p) => n + (p ? p.p : 0), 0) };
  if (full) Object.assign(d, { fps: fpsOf(c, g, r), liq: liqOf(c, g), bn: c.cap < g.fps, w: psuOf(c, g) });
  return d;
}

// Borde de papel cortado (zigzag) para la parte de abajo de la ficha
const ZIG = (() => {
  let d = 'M0 0H480';
  for (let x = 480; x > 0; x -= 12) d += `L${x - 6} 8L${x - 12} 0`;
  return `<svg class="zig" viewBox="0 0 480 8" preserveAspectRatio="none" aria-hidden="true"><path d="${d}Z"/></svg>`;
})();

const ascii = x => x.normalize('NFD').replace(/[̀-ͯ]/g, '');

// Texto que lleva el QR: la ficha completa, sin tildes para que cualquier lector la muestre bien
function qrText(d) {
  return ascii([
    'BUILD YOUR DREAM PC - Expo Tecnica 2026',
    `CPU: ${d.c.n}`,
    `GPU: ${d.g.n}`,
    `RAM: ${d.r.n}`,
    `FPS: ${d.fps} (${perfOf(d.fps)})`,
    `${tr('Fuente', 'PSU')}: ${d.w}W`,
    `${tr('Refrigeracion', 'Cooling')}: ${d.liq ? tr('Liquida 240mm', 'Liquid 240mm') : tr('Por aire', 'Air')}`,
    `Total: USD ${d.total}`,
    ...(CUR === 'ARS' ? [`Total ARS: ${Math.round(d.total * RATE)} (1 USD = ${RATE} ARS)`] : []),
  ].join('\n'));
}

/* ---------- Link que lleva el QR: abre ficha.html con la PC armada ---------- */
// Dirección pública de la carpeta donde está la página (termina en "/"), o '' si no hay
function cleanBase(u) {
  u = (u || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try {
    const url = new URL(u);
    if (!url.hostname.includes('.')) return '';
    let p = url.pathname;
    if (/\.[a-z0-9]+$/i.test(p.split('/').pop())) p = p.replace(/[^/]*$/, '');   // saca index.html
    return url.origin + (p.endsWith('/') ? p : p + '/');
  } catch (e) { return ''; }
}

// Dirección de la página actual, si es una dirección que el celular puede abrir
function autoBase() {
  const h = location.hostname;
  if (!/^https?:$/.test(location.protocol) || !h) return '';
  if (/^(localhost|127\.|0\.0\.0\.0|\[?::1\]?$)/i.test(h)) return '';
  return new URL('.', location.href).href;
}

function savedBase() {
  try { return cleanBase(localStorage.getItem('siteUrl')); } catch (e) { return ''; }
}

const siteBase = () => cleanBase(SITE_URL) || savedBase() || autoBase();

function fichaLink(base) {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const q = new URLSearchParams({
    b: `${sel.c}-${sel.g}-${sel.r}`,          // CPU-GPU-RAM
  });
  if (CUR === 'ARS') { q.set('m', 'ARS'); q.set('t', RATE); }   // solo si se ve en pesos
  if (L === 'en') q.set('l', 'en');                             // es es el idioma por defecto
  q.set('d', `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}`);
  return base + 'ficha.html?' + q;
}

// Lo que lleva el QR: el link a la ficha; si no hay dirección pública, los datos como texto
function qrPayload(d) {
  const base = siteBase();
  return base ? fichaLink(base) : qrText(d);
}

// Dibuja el QR como SVG (nítido al imprimir)
function qrSVG(text) {
  try {
    if (!text) return '';
    const q = QR.make(text), m = 4, n = q.n;
    let p = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (q.dark(r, c)) p += `M${c + m} ${r + m}h1v1h-1z`;
    }
    return `<svg class="qr" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="QR">
      <rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`;
  } catch (e) { return ''; }
}

function fichaHTML() {
  const s = t(), d = fichaData();
  const row = (l, n, p) => `<div class="pp-r"><span class="pp-l">${l}</span><span class="pp-n">${n}</span>${p ? `<b>${p}</b>` : ''}</div>`;

  const rows = d.parts.map((p, i) => row(s.fl[i], p ? p.n : '—', p ? money(p.p) : '—')).join('');
  let fps = '—', extra = '', foot = `<p class="pp-hint">${s.needAll}</p>`;

  if (d.full) {
    fps = `${d.fps} FPS · ${perfOf(d.fps)}`;
    extra = `<div class="pp-rows">
      ${row(s.fPsu, `${d.w}W · 80 Plus Bronze`)}
      ${row(s.fCool, d.liq ? s.coolLiq : s.coolAir)}
      ${row(s.fBn, d.bn ? s.yes : s.no)}
      ${CUR === 'ARS' ? row(s.sheetRate, `US$ 1 = AR$ ${RATE.toLocaleString('es-AR')}`) : ''}</div>`;
    foot = `<div class="pp-qr">${qrSVG(qrPayload(d))}<span>${siteBase() ? s.scanTxt : s.scanTxtPlain}</span></div>`;
  }

  const date = new Date().toLocaleDateString(L === 'en' ? 'en-US' : 'es-AR');
  return `
    <div class="paper">
      <div class="pp-top"><b>${s.sheetT}</b><span>Expo Técnica 2026</span></div>
      <h4 class="pp-title">Build Your Dream PC</h4>
      <div class="pp-rows">${rows}</div>
      <div class="pp-fps fps">${fps}</div>
      ${extra}
      <div class="pp-total"><span>${s.bdTot}</span><b class="fps">${money(d.total)}</b></div>
      <p class="pp-note">${CUR === 'ARS' ? s.bdNoteArs : s.bdNote}</p>
      ${foot}
      <div class="pp-date">${date}</div>
      ${ZIG}
    </div>`;
}

// Imprimir: se copia la ficha a un contenedor propio y se imprime solo eso
function printFicha() {
  if (!fichaData().full) return;
  $('printRoot').innerHTML = fichaHTML();
  window.print();
}
window.addEventListener('afterprint', () => { $('printRoot').innerHTML = ''; });

// QR grande para escanear directo desde la pantalla
function drawQR() {
  const d = fichaData();
  if (!d.full) return;
  const base = siteBase();
  $('qrbig').innerHTML = qrSVG(qrPayload(d));

  // Si la página se abre desde tu compu (localhost o archivo), se puede escribir la dirección pública
  const askSite = !cleanBase(SITE_URL) && !autoBase();
  $('qrsite').hidden = !askSite;
  $('qrnote').hidden = !(askSite && !base);
  const link = $('qrlink');
  link.hidden = !base;
  if (base) {
    const url = fichaLink(base);
    link.innerHTML = `${t().qrOpens} <a href="${url}" target="_blank" rel="noopener">${url}</a>`;
  }
}

function openQR() {
  if (!fichaData().full) return;
  $('siteurl').value = savedBase();
  drawQR();
  const dlg = $('qrdlg');
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}

/* ---------- 1. Actualiza todo el simulador cuando se elige una pieza o la moneda ---------- */
function build() {
  const s = t();
  const [c, g, r] = [CPU[sel.c], GPU[sel.g], RAM[sel.r]];
  const full = !!(c && g && r);

  // tarjetas elegidas
  document.querySelectorAll('.pc').forEach(b => {
    const on = sel[b.dataset.k] === +b.dataset.i;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });

  // PC en vivo
  $('tower').classList.toggle('on', full);
  $('tp').innerHTML = towerHTML(c, g, r, lastPick);

  // medidor de FPS
  const fps = full ? fpsOf(c, g, r) : 0;
  $('gn').textContent = full ? fps : '—';
  $('gv').style.strokeDasharray = Math.min(100, fps / MAXGPU * 100) + ' 100';
  $('gv').style.opacity = full ? 1 : 0;
  $('fr').textContent = full ? perfOf(fps) : '—';

  // avisos
  const fm = $('fm');
  if (!full) {
    fm.className = 'msg';
    fm.textContent = s.empty;
  } else {
    const bottleneck = c.cap < g.fps;
    const m = [bottleneck ? s.bn : s.ok];
    if (liqOf(c, g)) m.push(s.liq);        // gama alta: refrigeración líquida
    if (r.dual) m.push(s.dual);            // RAM en dual channel
    if (fps > 60) m.push(s.mon);           // aviso del monitor
    fm.className = 'msg' + (bottleneck ? ' warn' : '');
    fm.innerHTML = m.join('<br>');
  }

  // moneda: botones y cotización
  document.querySelectorAll('[data-cur]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cur === CUR));
  $('rateRow').hidden = CUR !== 'ARS';

  // ficha y botones
  $('ficha').innerHTML = fichaHTML();
  document.querySelectorAll('[data-act=print],[data-act=img],[data-act=qr]').forEach(b => { b.disabled = !full; });
}

/* ---------- 4. Voz: escuchar la carta en inglés y en español ---------- */
// (las funciones de voz canSpeak, pickVoice y speakOne están en voz.js)

function say(i, which) {                    // which: 'en', 'es' o 'both'
  const s = t(), msg = $('gmsg');
  msg.textContent = '';
  if (!canSpeak) { msg.textContent = s.noVoice; return; }
  const [en, es, , ces, cen] = G[i];
  const clean = x => x.replace(/\s*\/\s*/g, ', ');
  speechSynthesis.cancel();
  if (which !== 'es' && !speakOne(`${clean(en)}. ${cen}`, 'en')) msg.textContent = s.noVoiceEn;
  if (which !== 'en' && !speakOne(`${clean(es)}. ${ces}`, 'es')) msg.textContent = s.noVoiceEs;
}

/* ---------- 4. Glosario (30 cartas con dibujo, concepto, voz y buscador) ---------- */
function gcard(g, i) {
  const [en, es, ic, ces, cen] = g;
  return `
    <div class="gcell">
      <button class="flip" data-gi="${i}" aria-pressed="false">
        <span class="face f">${icon(ic)}<b>${en}</b><small>${cen}</small></span>
        <span class="face b">${icon(ic)}<b>${es}</b><small>${ces}</small></span>
      </button>
      <div class="gaudio" hidden>
        <button data-say="en" data-gi="${i}" aria-label="${tr('Escuchar en inglés', 'Listen in English')}">🔊 English</button>
        <button data-say="es" data-gi="${i}" aria-label="${tr('Escuchar en español', 'Listen in Spanish')}">🔊 Español</button>
        <button data-say="both" data-gi="${i}" aria-label="${tr('Escuchar en los dos idiomas', 'Listen in both languages')}">🔊 EN + ES</button>
      </div>
    </div>`;
}

function gloss() {
  const q = $('q').value.toLowerCase();
  $('gl').innerHTML = G
    .map((g, i) => [g, i])
    .filter(([g]) => [g[0], g[1], g[3], g[4]].join(' ').toLowerCase().includes(q))
    .map(([g, i]) => gcard(g, i)).join('');
  $('gmsg').textContent = '';
}

// Toca una carta: se da vuelta y aparecen los botones para escuchar
function flipCard(b) {
  const on = b.classList.toggle('on');
  b.setAttribute('aria-pressed', on);
  b.parentElement.querySelector('.gaudio').hidden = !on;
  $('gmsg').textContent = '';
  if (!on && canSpeak) speechSynthesis.cancel();
}

/* ---------- Dibuja toda la página en el idioma actual ---------- */
function render() {
  const s = t();
  document.documentElement.lang = L;

  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = s[e.dataset.t]; });

  $('nav').innerHTML = ['build', 'video', 'game', 'gloss']
    .map((h, i) => `<a href="#${h}">${s.nav[i]}</a>`).join('');
  $('q').placeholder = s.sp;

  document.querySelectorAll('.lang button').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.l === L);
  });

  buildPick();
  buildRig();
  build();
  v2draw();
  gmDraw();
  gloss();
}

/* ---------- Clics ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.l) {                    // cambiar idioma
    L = b.dataset.l;
    render();
  } else if (b.dataset.cur) {           // cambiar moneda (dólar / peso)
    CUR = b.dataset.cur;
    buildPick();
    build();
  } else if (b.dataset.k) {             // elegir CPU / GPU / RAM
    sel[b.dataset.k] = +b.dataset.i;
    lastPick = b.dataset.k;
    build();
    lastPick = null;
    v2draw();
  } else if (b.dataset.act === 'print') {
    printFicha();
  } else if (b.dataset.act === 'img') {
    downloadImg();
  } else if (b.dataset.act === 'qr') {
    openQR();
  } else if (b.dataset.act === 'qrclose') {
    $('qrdlg').close();
  } else if (b.dataset.say) {           // escuchar una carta
    say(+b.dataset.gi, b.dataset.say);
  } else if (b.classList.contains('flip')) {
    flipCard(b);
  }
});

// Cerrar el QR grande tocando afuera
$('qrdlg').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.close();
});

$('q').addEventListener('input', gloss);

// Dirección pública de la página (para que el QR abra la ficha desde el celular)
$('siteurl').addEventListener('input', e => {
  try { localStorage.setItem('siteUrl', e.target.value.trim()); } catch (err) {}
  drawQR();
  build();
});

// Cotización editable: pesos por cada dólar
$('rate').value = RATE;
$('rate').addEventListener('input', e => {
  const v = +e.target.value;
  if (v > 0) {
    RATE = v;
    try { localStorage.setItem('rate', v); } catch (err) {}
    buildPick();
    build();
  }
});

gmStart();    // arranca el juego
render();     // arranca la página

</script>

/* Descargar imagen del presupuesto con las piezas elegidas (misma tarjeta que abre el QR) */
function downloadImg() {
  const d = fichaData();
  if (!d.full) return;
  const cv = document.createElement('canvas');
  cv.width = 900; cv.height = 1540;
  const n = new Date(), z = v => String(v).padStart(2, '0');
  const res = drawCard(cv, { c: d.c, g: d.g, r: d.r, w: d.w, liq: d.liq, L, ARS: CUR === 'ARS', RATE, date: `${z(n.getDate())}/${z(n.getMonth() + 1)}/${n.getFullYear()}` });
  res.ready.then(() => cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'mi-pc-sonada.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png'));
}

/* Dirección de la página para el QR: solo se muestra si hace falta escribirla */
(function () {
  const box = document.getElementById('siteBox'), inp = document.getElementById('siteurl2');
  if (cleanBase(SITE_URL) || autoBase()) return;
  box.hidden = false;
  inp.value = savedBase();
  inp.addEventListener('input', () => {
    try { localStorage.setItem('siteUrl', inp.value.trim()); } catch (e) {}
    build();
  });
})();
  </script>
